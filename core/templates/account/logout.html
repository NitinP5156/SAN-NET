{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Out{% endblock %}

{% block extra_head %}
<style>
.form-container {
  width: 400px;
  background: linear-gradient(#212121, #212121) padding-box,
              linear-gradient(145deg, transparent 35%,#e81cff, #40c9ff) border-box;
  border: 2px solid transparent;
  padding: 32px 24px;
  font-size: 14px;
  font-family: inherit;
  color: white;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-sizing: border-box;
  border-radius: 16px;
}
.form-container button:active {
  scale: 0.95;
}
.form-container .form-submit-btn {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  align-self: flex-start;
  font-family: inherit;
  color: #717171;
  font-weight: 600;
  width: 40%;
  background: #313131;
  border: 1px solid #414141;
  padding: 12px 16px;
  font-size: inherit;
  gap: 8px;
  margin-top: 8px;
  cursor: pointer;
  border-radius: 6px;
}
.form-container .form-submit-btn:hover {
  background-color: #fff;
  border-color: #fff;
}
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-100 via-blue-100 to-white dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 py-12 px-4 sm:px-6 lg:px-8">
  <div class="form-container">
    <div class="flex flex-col items-center mb-2">
      <img class="h-12 w-12 mb-2" src="{% static 'img/logo.png' %}" alt="SAN-NET Logo" />
      <h2 class="mt-2 text-center text-2xl font-extrabold text-white tracking-tight">Sign Out</h2>
      <p class="mt-2 text-center text-xs text-gray-400">Are you sure you want to sign out?</p>
    </div>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit" class="form-submit-btn">Sign Out</button>
    </form>
    <div class="mt-2 text-center text-xs text-gray-400">
      <a href="/" class="font-medium text-purple-400 hover:text-purple-200">Return to Home</a>
    </div>
  </div>
</div>
{% endblock %}
